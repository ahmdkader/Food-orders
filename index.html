  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:#D8CFBB;border-radius:4px}

<body>
<div id="root" class="min-h-screen" style="max-width:100vw;overflow-x:hidden"></div>
<div id="toastRoot" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-[92%] max-w-sm"></div>

<script>
/* ============================================================
   ورقة الطلب — تطبيق تنظيم طلبات الأكل للزمايل
   Backend: Firebase Realtime Database
============================================================ */

/* حط بيانات مشروعك هنا (خطوات في README.md) */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC32u3Rk7QG4rEUqXp_qJ_97j_hsE-J6PM",
  authDomain: "food-orders-bbeff.firebaseapp.com",
  databaseURL: "https://food-orders-bbeff-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "food-orders-bbeff",
};

/* باسورد الأدمن — غيّره لأي حاجة تانية قبل ما ترفع المشروع */
const ADMIN_PASSWORD = "admin";

const EMOJI_AVATARS = ['😀','😎','🤓','🥳','😺','🐶','🦊','🐼','🦁','🐸','🐵','🐷','🍕','🍔','🌮','🍩','⚡','🔥','🌟','💪','🚀','🎯','🎧','☕'];

const root = document.getElementById('root');
let db = null;
let sid = null;
let meta = null;
let people = {};
let chat = [];
let historyList = [];
let accountsList = [];
let myId = localStorage.getItem('food-app-account-id') || null;
let isAdmin = localStorage.getItem('food-app-is-admin') === 'true';
let tab = 'voting';
let notifStartTime = Date.now();
let notifPermission = (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported';

let newOption = { name:'', menuType:'none', menuValue:'', menuFileType:'' };
let itemDesc='', itemQty=1;
let chatText='';
let loginMode = 'new'; // 'new' | 'existing'
let gateAvatar = null; // set on first render of the login gate

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayId(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function defaultMeta(){
  return { date: todayId(), createdAt: Date.now(), restaurantOptions: [], deliveryFee:0, taxEnabled:false, taxPercent:14, instapayLink:'', votingLocked:false };
}
function defaultPerson(id){ return { id, name:'', avatar:null, vote:null, items:[], paid:false }; }

/* ---------------- toast + notifications ---------------- */
function targetTabForType(type){
  if(type==='chat') return 'chat';
  if(type==='payment_reminder' || type==='order_arrived') return isAdmin? 'payment' : 'mybill';
  return null;
}
function showToast(title, body, targetTab){
  const el = document.createElement('div');
  el.className = 'toast card p-3 shadow-xl' + (targetTab? ' cursor-pointer' : '');
  el.innerHTML = `<p class="font-bold text-sm" style="color:#1F1B16">${esc(title)}</p>${body?`<p class="text-xs text-[#6B5F4D] mt-0.5">${esc(body)}</p>`:''}`;
  if(targetTab) el.onclick = ()=>{ setTab(targetTab); el.remove(); };
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(()=>el.remove(), 6000);
  if(notifPermission==='granted'){
    try{
      const n = new Notification(title, { body, icon:'icon.svg' });
      if(targetTab) n.onclick = ()=>{ window.focus(); setTab(targetTab); n.close(); };
    }catch(e){}
  }
}
function requestNotifPermission(){
  if(typeof Notification==='undefined'){ alert('المتصفح ده مش بيدعم الإشعارات'); return; }
  Notification.requestPermission().then(p=>{ notifPermission=p; renderApp(); });
}
function attachNotifications(){
  db.ref(`sessions/${sid}/notify/${myId}`).on('child_added', snap=>{
    const v = snap.val();
    if(v && v.time > notifStartTime) showToast(v.title || '🔔 إشعار', v.message || '', targetTabForType(v.type));
  });
  db.ref(`sessions/${sid}/notify/all`).on('child_added', snap=>{
    const v = snap.val();
    if(v && v.time > notifStartTime) showToast(v.title || '🔔 إشعار عام', v.message || '', targetTabForType(v.type));
  });
}
function notifyPayment(personId, personName){
  db.ref(`sessions/${sid}/notify/${personId}`).push({ type:'payment_reminder', title:'💳 فاتورة الأكل', message:`${myPersonName()} بيفكّرك تدفع حسابك`, time: Date.now() });
  showToast('تم إرسال تذكير', `لـ ${personName}`);
}
function notifyAll(){
  db.ref(`sessions/${sid}/notify/all`).push({ type:'order_arrived', title:'🎉 الأوردر وصل!', message:'الأكل وصل من المطعم، اتفضلوا', time: Date.now() });
  showToast('تم الإرسال', 'كل الزمايل هياخدوا إشعار');
}
function myPersonName(){ return me().name || 'الأدمن'; }

/* ---------------- Firebase init ---------------- */
function initFirebase(){
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith('ضع-')){ renderConfigMissingScreen(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    boot();
  }catch(e){ renderConfigMissingScreen('في مشكلة في بيانات Firebase — راجعها في أول الكود.'); }
}
function renderConfigMissingScreen(err){
  root.innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-6" style="background:#1F1B16">
    <div class="card p-6 max-w-md w-full text-center" style="background:#FAF6EE;border-color:#E3A008;border-style:dashed;border-width:3px">
      <div class="inline-block bg-[#E3A008] rounded-full p-3 mb-2">⚠️</div>
      <h1 class="text-xl font-bold mb-2" style="color:#1F1B16">لسه محتاج إعداد</h1>
      <p class="text-sm text-[#6B5F4D]">${err? esc(err) : 'راجع بيانات Firebase في أول ملف index.html'}</p>
    </div>
  </div>`;
}

/* ---------------- boot ---------------- */
function boot(){
  db.ref('current').once('value').then(snap=>{
    sid = snap.val();
    if(!sid){ sid = todayId(); db.ref('current').set(sid); }
    return db.ref(`sessions/${sid}/meta`).once('value');
  }).then(snap=>{
    if(!snap.exists()) db.ref(`sessions/${sid}/meta`).set(defaultMeta());
    checkLogin();
  });
  /* live-follow session switches: if the admin archives & starts a new order,
     every connected device jumps to the new session automatically */
  db.ref('current').on('value', snap=>{
    const newSid = snap.val();
    if(newSid && sid && newSid!==sid){
      sid = newSid;
      attachSession();
      attachNotifications();
      notifStartTime = Date.now();
      tab = 'voting';
      if(myId) checkLogin();
    }
  });
}
function checkLogin(){
  if(!myId){ renderLoginGate(); return; }
  db.ref(`accounts/${myId}`).once('value').then(snap=>{
    if(!snap.exists()){
      /* account no longer exists (removed by an admin, or cleared) - log out */
      localStorage.removeItem('food-app-account-id');
      myId = null;
      renderLoginGate();
      return;
    }
    joinSession(snap.val());
  });
}
function joinSession(account){
  db.ref(`sessions/${sid}/people/${myId}`).once('value').then(psnap=>{
    const existing = psnap.val() || {};
    const merged = { ...defaultPerson(myId), ...existing, items: existing.items||[], name: account.name, avatar: account.avatar };
    db.ref(`sessions/${sid}/people/${myId}`).set(merged).then(()=>{
      attachSession();
      attachNotifications();
      renderApp();
    });
  });
}
function attachSession(){
  db.ref(`sessions/${sid}/meta`).on('value', snap=>{ meta = snap.val() || defaultMeta(); if(myId) renderApp(); });
  db.ref(`sessions/${sid}/people`).on('value', snap=>{ people = snap.val() || {}; if(myId) renderApp(); });
  db.ref(`sessions/${sid}/chat`).on('value', snap=>{
    const val = snap.val() || {};
    chat = Object.keys(val).sort().map(k=>val[k]);
    if(myId) renderApp();
  });
}
function me(){
  const p = people[myId] || defaultPerson(myId);
  return { ...defaultPerson(myId), ...p, items: p.items||[] };
}

/* ---------------- login / signup gate ---------------- */
function renderLoginGate(){
  if(!gateAvatar) gateAvatar = EMOJI_AVATARS[Math.floor(Math.random()*EMOJI_AVATARS.length)];
  root.innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-6" style="background:#1F1B16">
    <div class="card p-7 max-w-sm w-full" style="background:#FAF6EE;border-color:#E3A008;border-style:dashed;border-width:3px">
      <div class="text-center mb-4">
        <div class="inline-block bg-[#E3A008] rounded-full p-4 mb-2 text-3xl">🍽️</div>
        <h1 class="text-2xl font-bold" style="color:#1F1B16">ورقة الطلب</h1>
      </div>
      <div class="flex gap-1 mb-4 bg-[#F3EEE1] rounded-xl p-1">
        <button onclick="setLoginMode('new')" class="flex-1 text-sm font-bold py-2 rounded-lg" style="${loginMode==='new'?'background:#1F1B16;color:#fff':'color:#6B5F4D'}">حساب جديد</button>
        <button onclick="setLoginMode('existing')" class="flex-1 text-sm font-bold py-2 rounded-lg" style="${loginMode==='existing'?'background:#1F1B16;color:#fff':'color:#6B5F4D'}">عندي حساب</button>
      </div>
      ${loginMode==='new' ? `
        <p class="text-xs text-[#9C9080] mb-3 text-center">اسمك، أفاتار، ورقم سري بسيط (4 أرقام) عشان تقدر تدخل بنفس الحساب من أي جهاز تاني</p>
        <input id="nameInput" placeholder="اسمك..." class="w-full rounded-xl border-2 border-[#D8CFBB] px-4 py-3 text-base text-center outline-none focus:border-[#E3A008] mb-3">
        <div class="grid grid-cols-6 gap-2 mb-3" id="avatarGrid">
          ${EMOJI_AVATARS.map(e=>`<button onclick="pickGateAvatar('${e}')" data-emoji="${e}" class="text-2xl rounded-lg py-1.5 border-2" style="border-color:${e===gateAvatar?'#E3A008':'#E7DFC9'}">${e}</button>`).join('')}
        </div>
        <input id="pinInput" type="tel" maxlength="4" placeholder="رقم سري من 4 أرقام" class="w-full rounded-xl border-2 border-[#D8CFBB] px-4 py-3 text-lg text-center num outline-none focus:border-[#E3A008] mb-4">
        <button onclick="signup()" class="w-full bg-[#1F1B16] text-white rounded-xl py-3 font-bold">إنشاء الحساب والدخول</button>
      ` : `
        <p class="text-xs text-[#9C9080] mb-3 text-center">ادخل بنفس الاسم والرقم السري اللي سجّلت بيهم أول مرة</p>
        <input id="nameInput" placeholder="اسمك..." class="w-full rounded-xl border-2 border-[#D8CFBB] px-4 py-3 text-base text-center outline-none focus:border-[#E3A008] mb-3">
        <input id="pinInput" type="tel" maxlength="4" placeholder="الرقم السري" class="w-full rounded-xl border-2 border-[#D8CFBB] px-4 py-3 text-lg text-center num outline-none focus:border-[#E3A008] mb-4">
        <button onclick="login()" class="w-full bg-[#1F1B16] text-white rounded-xl py-3 font-bold">دخول</button>
      `}
      <p id="loginError" class="text-xs text-[#B3432B] text-center mt-3"></p>
    </div>
  </div>`;
}
function setLoginMode(m){ loginMode=m; renderLoginGate(); }
function pickGateAvatar(e){
  gateAvatar = e;
  document.querySelectorAll('#avatarGrid button').forEach(b=> b.style.borderColor = (b.dataset.emoji===e?'#E3A008':'#E7DFC9'));
}
function signup(){
  const name = document.getElementById('nameInput').value.trim();
  const pin = document.getElementById('pinInput').value.trim();
  const err = document.getElementById('loginError');
  if(!name){ err.textContent='اكتب اسمك الأول'; return; }
  if(!/^[0-9]{4}$/.test(pin)){ err.textContent='الرقم السري لازم يبقى 4 أرقام'; return; }
  db.ref('accounts').once('value').then(snap=>{
    const accounts = snap.val() || {};
    const clash = Object.values(accounts).find(a=>a.name===name);
    if(clash){ err.textContent='الاسم ده مسجل بالفعل - جرب "عندي حساب" أو اسم مختلف'; return; }
    const id = uid();
    const account = { id, name, avatar:{type:'emoji',value:gateAvatar}, pin, createdAt: Date.now() };
    db.ref(`accounts/${id}`).set(account).then(()=>{
      myId = id;
      localStorage.setItem('food-app-account-id', id);
      joinSession(account);
    });
  });
}
function login(){
  const name = document.getElementById('nameInput').value.trim();
  const pin = document.getElementById('pinInput').value.trim();
  const err = document.getElementById('loginError');
  if(!name || !pin){ err.textContent='اكتب الاسم والرقم السري'; return; }
  db.ref('accounts').once('value').then(snap=>{
    const accounts = snap.val() || {};
    const match = Object.values(accounts).find(a=>a.name===name && a.pin===pin);
    if(!match){ err.textContent='الاسم أو الرقم السري غلط'; return; }
    myId = match.id;
    localStorage.setItem('food-app-account-id', match.id);
    joinSession(match);
  });
}
function logout(){
  localStorage.removeItem('food-app-account-id');
  myId = null;
  isAdmin = false;
  localStorage.removeItem('food-app-is-admin');
  loginMode = 'existing';
  renderLoginGate();
}

/* ---------------- data helpers ---------------- */
function updateMe(patch){ db.ref(`sessions/${sid}/people/${myId}`).update(patch); }
function participants(){ return Object.values(people).filter(p=>p.items && p.items.length>0); }
function leadingOptionId(){
  const counts = {};
  (meta.restaurantOptions||[]).forEach(o=>counts[o.id]=0);
  Object.values(people).forEach(p=>{ if(p.vote && counts[p.vote]!==undefined) counts[p.vote]++; });
  let best=-1, id=null;
  Object.entries(counts).forEach(([k,v])=>{ if(v>best){best=v; id=k;} });
  return id;
}
function currentRestaurantName(){
  const id = leadingOptionId();
  const opt = (meta.restaurantOptions||[]).find(o=>o.id===id);
  return opt ? opt.name : 'لسه معروفش';
}
function deliveryShare(){ const n=participants().length; return n>0 ? (meta.deliveryFee||0)/n : 0; }
function personTotal(p){
  const subtotal = (p.items||[]).reduce((s,i)=>s+i.price*i.qty,0);
  const tax = meta.taxEnabled ? subtotal*(meta.taxPercent||0)/100 : 0;
  const delivery = (p.items&&p.items.length>0) ? deliveryShare() : 0;
  return { subtotal, tax, delivery, total: subtotal+tax+delivery };
}
function avatarHtml(p, size){
  size = size || 32;
  if(p && p.avatar && p.avatar.type==='emoji'){
    return `<span style="font-size:${size*0.6}px;width:${size}px;height:${size}px" class="inline-flex items-center justify-center rounded-full bg-[#F3EEE1] border border-[#E7DFC9]">${p.avatar.value}</span>`;
  }
  if(p && p.avatar && p.avatar.type==='image'){
    return `<img src="${p.avatar.value}" style="width:${size}px;height:${size}px" class="rounded-full object-cover border border-[#E7DFC9]">`;
  }
  const letter = (p&&p.name? p.name[0] : '?').toUpperCase();
  return `<span style="width:${size}px;height:${size}px;font-size:${size*0.45}px;background:#E3A008;color:#1F1B16" class="inline-flex items-center justify-center rounded-full font-bold">${esc(letter)}</span>`;
}
function compressImage(dataUrl, maxW){
  maxW = maxW || 500;
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const w = img.width*scale, h = img.height*scale;
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = dataUrl;
  });
}

/* ---------------- shell ---------------- */
function tabList(){
  const t = [{id:'voting',label:'التصويت',icon:'🗳️'},{id:'ordering',label:'الطلبات',icon:'🛍️'}];
  if(isAdmin){
    t.push({id:'billing',label:'الحساب',icon:'🧾'});
    t.push({id:'payment',label:'الدفع',icon:'💳'});
    t.push({id:'history',label:'الهيستوري',icon:'📜'});
    t.push({id:'members',label:'الأعضاء',icon:'👥'});
  } else {
    t.push({id:'mybill',label:'حسابي',icon:'🧾'});
  }
  t.push({id:'chat',label:'الشات',icon:'💬'});
  return t;
}
function renderApp(){
  const tabs = tabList();
  if(!tabs.find(t=>t.id===tab)) tab='voting';
  root.innerHTML = `
  <header class="sticky top-0 z-20 shadow-lg" style="background:#1F1B16;color:#FAF6EE;max-width:100vw">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2 min-w-0">
        <img src="icon.svg" class="w-9 h-9 rounded-lg flex-shrink-0" alt="logo">
        <div class="min-w-0"><div class="font-bold leading-none truncate">ورقة الطلب</div><div class="text-[10px] text-[#B8AD97] mt-0.5 truncate">${esc(meta.date)} · ${esc(currentRestaurantName())}</div></div>
      </div>
      <div class="flex items-center gap-1 flex-shrink-0">
        <button onclick="renderProfileModal()" class="flex items-center gap-1 text-xs bg-[#332C24] px-2 py-1 rounded-full">
          ${avatarHtml(me(),18)} ${esc(me().name)} ${isAdmin?'<span class="text-[#E3A008]">👑</span>':''}
        </button>
        <button onclick="renderSettings()" class="p-2 hover:bg-[#332C24] rounded-lg">⚙️</button>
      </div>
    </div>
    <nav class="max-w-2xl mx-auto px-2 pb-2 flex gap-1 overflow-x-auto" style="max-width:100vw">
      ${tabs.map(t=>`<button onclick="setTab('${t.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap flex-shrink-0"
        style="${tab===t.id?'background:#E3A008;color:#1F1B16':'background:#332C24;color:#B8AD97'}">${t.icon} ${t.label}</button>`).join('')}
    </nav>
  </header>
  <main class="max-w-2xl mx-auto p-4 pb-10" id="tabContent" style="max-width:100vw"></main>
  ${renderFooter()}
  <div id="modalRoot"></div>`;
  renderTab();
}
function renderFooter(){
  return `
  <footer class="max-w-2xl mx-auto px-4 pb-6 pt-2 text-center" style="color:#9C9080" dir="ltr">
    <p class="text-[11px]">© 2026 All rights reserved</p>
    <p class="text-[11px] mt-0.5">Ahmed Abdelrahman · Egypt</p>
    <p class="text-[11px] num mt-0.5">+201069296992</p>
  </footer>`;
}
function setTab(t){ tab=t; renderApp(); }
function renderTab(){
  const el = document.getElementById('tabContent');
  if(tab==='voting') el.innerHTML = renderVoting();
  else if(tab==='ordering') el.innerHTML = renderOrdering();
  else if(tab==='billing' && isAdmin) el.innerHTML = renderBilling();
  else if(tab==='payment' && isAdmin) el.innerHTML = renderPayment();
  else if(tab==='mybill' && !isAdmin) el.innerHTML = renderMyBill();
  else if(tab==='history' && isAdmin){ el.innerHTML = '<div class="text-center text-sm text-[#9C9080] py-6">بيتحمّل...</div>'; loadHistory(); }
  else if(tab==='members' && isAdmin){ el.innerHTML = '<div class="text-center text-sm text-[#9C9080] py-6">بيتحمّل...</div>'; loadAccounts(); }
  else if(tab==='chat'){ el.innerHTML = renderChat(); scrollChatBottom(); }
}

/* ---------------- VOTING (always live, no lock) ---------------- */
function voteCounts(){
  const c = {};
  (meta.restaurantOptions||[]).forEach(o=>c[o.id]=0);
  Object.values(people).forEach(p=>{ if(p.vote && c[p.vote]!==undefined) c[p.vote]++; });
  return c;
}
function renderVoting(){
  const counts = voteCounts();
  const total = Object.values(people).filter(p=>p.vote).length;
  const opts = meta.restaurantOptions||[];
  const leaderId = leadingOptionId();
  const locked = !!meta.votingLocked;
  const canAct = isAdmin || !locked;
  const optionsHtml = opts.map(o=>{
    const count = counts[o.id]||0;
    const pct = total>0? Math.round(count/total*100):0;
    const mine = me().vote===o.id;
    const isLeader = o.id===leaderId && count>0;
    let menuHtml = '';
    if(o.menuType==='link') menuHtml = `<a href="${esc(o.menuValue)}" target="_blank" onclick="event.stopPropagation()" class="text-[11px] underline text-[#6B5F4D]">📋 المنيو</a>`;
    else if(o.menuType==='file' && o.menuFileType==='image') menuHtml = `<img src="${o.menuValue}" onclick="event.stopPropagation();openImagePreview('${o.id}')" class="w-8 h-8 rounded object-cover cursor-pointer border border-[#E7DFC9]">`;

function toggleVotingLock(){ db.ref(`sessions/${sid}/meta`).update({ votingLocked: !meta.votingLocked }); }
function setMenuType(t){ newOption.menuType=t; renderTab(); }
async function handleMenuFile(ev){
  const file = ev.target.files[0]; if(!file) return;
  const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  if(file.type.startsWith('image/')){ newOption.menuValue = await compressImage(dataUrl,1000); newOption.menuFileType='image'; }
  else{
    if(file.size > 3*1024*1024) alert('الملف كبير أوي، فضّل رابط بدل الرفع.');
    newOption.menuValue = dataUrl; newOption.menuFileType='pdf';
  }
  renderTab();
}
function addOption(){
  if(meta.votingLocked && !isAdmin) return;
  const name = (newOption.name||'').trim(); if(!name) return;
  const opt = { id: uid(), name, menuType:newOption.menuType, menuValue:newOption.menuValue, menuFileType:newOption.menuFileType };
  db.ref(`sessions/${sid}/meta/restaurantOptions`).set([...(meta.restaurantOptions||[]), opt]);
  newOption = { name:'', menuType:'none', menuValue:'', menuFileType:'' };
  const nameEl = document.getElementById('optNameInputField'); if(nameEl) nameEl.value='';
}
function castVote(id){ if(meta.votingLocked && !isAdmin) return; updateMe({ vote:id }); }
function deleteOption(id, name){
  if(!isAdmin) return;
  if(!confirm(`تمسح "${name}" من قائمة التصويت؟`)) return;
  const opts = (meta.restaurantOptions||[]).filter(o=>o.id!==id);
  db.ref(`sessions/${sid}/meta/restaurantOptions`).set(opts);
}
function openImagePreview(id){
  const opt = (meta.restaurantOptions||[]).find(o=>o.id===id); if(!opt) return;
  document.getElementById('modalRoot').innerHTML = `<div class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-30" onclick="closeModal()"><img src="${opt.menuValue}" class="max-w-full max-h-full rounded-lg"></div>`;
}

function numFocus(el){
  if(el.value==='0' || el.value==='0.00' || Number(el.value)===0){ el.value=''; }
  else { const v=el.value; el.value=''; el.value=v; } /* moves cursor to end */
}
function itemsArr(curr){ return Array.isArray(curr) ? curr : (curr ? Object.values(curr) : []); }
function addItem(){
  const d=(itemDesc||'').trim(); if(!d) return;
  const newItem = { id:uid(), desc:d, qty:Number(itemQty)||1, price:0 };
  itemDesc=''; itemQty=1;
  const dEl = document.getElementById('itemDescInputField'); if(dEl) dEl.value='';
  const qEl = document.getElementById('itemQtyInputField'); if(qEl) qEl.value=1;
  if(dEl) dEl.focus();
  /* transaction = atomic read-modify-write, so two quick adds in a row
     can never overwrite each other (unlike a plain .set() of a locally-cached array) */
  db.ref(`sessions/${sid}/people/${myId}/items`).transaction(curr => itemsArr(curr).concat([newItem]));
}
function removeItem(personId, itemId){
  if(personId!==myId && !isAdmin) return;
  db.ref(`sessions/${sid}/people/${personId}/items`).transaction(curr => itemsArr(curr).filter(i=>i.id!==itemId));

function editItemAdmin(personId, itemId){

  const item = (p.items||[]).find(i=>i.id===itemId); if(!item) return;
  const newDesc = prompt('تعديل الصنف:', item.desc); if(newDesc===null) return;
  const newQty = prompt('العدد:', item.qty); if(newQty===null) return;
  db.ref(`sessions/${sid}/people/${personId}/items`).transaction(curr =>
    itemsArr(curr).map(i=> i.id===itemId? {...i, desc:newDesc.trim()||item.desc, qty:Number(newQty)||item.qty} : i));
}

/* ---------------- HISTORY (admin only) ---------------- */
function loadHistory(){
  db.ref('historyIndex').once('value').then(async snap=>{
    const ids = snap.val() ? Object.keys(snap.val()) : [];
    const list = [];
    for(const hid of ids){
      const [m,p] = await Promise.all([
        db.ref(`sessions/${hid}/meta`).once('value'),
        db.ref(`sessions/${hid}/people`).once('value'),
      ]);
      const mv = m.val(), pv = p.val()||{};
      if(!mv) continue;
      const allPeople = Object.values(pv);
      const arr = allPeople.filter(x=>x.items&&x.items.length>0);
      list.push({ id:hid, meta:mv, people:arr, allPeople });
    }
    list.sort((a,b)=> (b.meta.createdAt||0) - (a.meta.createdAt||0));
    historyList = list;
    if(tab==='history') document.getElementById('tabContent').innerHTML = renderHistory();
  });
}
function historyRestaurantName(entry){
  const counts = {};
  (entry.meta.restaurantOptions||[]).forEach(o=>counts[o.id]=0);
  (entry.allPeople||[]).forEach(p=>{ if(p.vote && counts[p.vote]!==undefined) counts[p.vote]++; });
  let best=-1, id=null;
  Object.entries(counts).forEach(([k,v])=>{ if(v>best){best=v; id=k;} });
  const opt = (entry.meta.restaurantOptions||[]).find(o=>o.id===id);
  return opt ? opt.name : (entry.meta.restaurantOptions&&entry.meta.restaurantOptions[0]? entry.meta.restaurantOptions[0].name : '-');
}
function historyTotal(entry){
  const savedMeta = meta; meta = entry.meta;
  const total = entry.people.reduce((s,p)=>s+personTotal(p).total,0);
  meta = savedMeta;
  return total;
}
function renderHistory(){
  if(historyList.length===0) return `<div class="card p-6 text-center text-[#9C9080]">مفيش هيستوري لسه</div>`;
  return `
  <div class="flex justify-end mb-3"><button onclick="clearAllHistory()" class="text-xs font-bold text-[#B3432B]">🗑️ مسح كل الهيستوري</button></div>
  <div class="space-y-3">
    ${historyList.map(h=>`
      <div class="card p-4 cursor-pointer" onclick="showHistoryDetail('${h.id}')">
        <div class="flex items-center justify-between">
          <div><p class="font-bold" style="color:#1F1B16">${esc(h.meta.date)}</p>
          <p class="text-xs text-[#9C9080]">${esc(historyRestaurantName(h))} · ${h.people.length} شخص</p></div>
          <div class="text-left">
            <p class="num font-bold" style="color:#1F1B16">${historyTotal(h).toFixed(2)} ج</p>
            <button onclick="event.stopPropagation();deleteHistoryEntry('${h.id}')" class="text-xs text-[#B3432B]">🗑️ مسح</button>
          </div>
        </div>
      </div>`).join('')}
  </div>`;
}
function showHistoryDetail(hid){
  const entry = historyList.find(h=>h.id===hid); if(!entry) return;
  const savedMeta = meta; meta = entry.meta;
  const grand = entry.people.reduce((s,p)=>s+personTotal(p).total,0);
  const rows = entry.people.map(p=>{
    const t = personTotal(p);
    const itemsLine = p.items.map(i=>`${esc(i.desc)} ×${i.qty} (${(i.price*i.qty).toFixed(2)} ج)`).join('، ');
    return `<div class="border-b border-dashed border-[#E7DFC9] pb-2 mb-2 last:border-0">
      <div class="flex items-center justify-between">
        <span class="flex items-center gap-1.5 font-semibold text-sm" style="color:#1F1B16">${avatarHtml(p,20)} ${esc(p.name)}</span>
        <span class="num text-sm font-bold" style="color:#1F1B16">${t.total.toFixed(2)} ج ${p.paid?'<span style=\"color:#2F6B4F\">✓ مدفوع</span>':'<span style=\"color:#B3432B\">✗ لسه</span>'}</span>
      </div>
      <p class="text-xs text-[#9C9080] mt-1">${itemsLine}</p>
    </div>`;
  }).join('');
  meta = savedMeta;
  document.getElementById('modalRoot').innerHTML = `
  <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-30" onclick="closeModal()">
    <div class="card p-5 max-w-md w-full" style="background:#FAF6EE;max-height:85vh;overflow-y-auto" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-1"><h3 class="font-bold" style="color:#1F1B16">🧾 ${esc(entry.meta.date)}</h3><button onclick="closeModal()">✕</button></div>
      <p class="text-sm text-[#6B5F4D] mb-4">المطعم: ${esc(historyRestaurantName(entry))}</p>
      ${rows || '<p class="text-sm text-[#9C9080] text-center py-4">مفيش طلبات مسجلة</p>'}
      <div class="flex justify-between font-bold pt-3 mt-2 border-t-2 border-[#E7DFC9]" style="color:#1F1B16">
        <span>الإجمالي الكلي</span><span class="num">${grand.toFixed(2)} ج</span>
      </div>
    </div>
  </div>`;
}
function deleteHistoryEntry(hid){
  if(!confirm('تمسح الطلب ده من الهيستوري؟')) return;
  db.ref(`sessions/${hid}`).remove();
  db.ref(`historyIndex/${hid}`).remove();
  loadHistory();
}
function clearAllHistory(){
  if(!confirm('متأكد عايز تمسح كل الهيستوري؟ الإجراء ده نهائي.')) return;
  historyList.forEach(h=>{ db.ref(`sessions/${h.id}`).remove(); });
  db.ref('historyIndex').remove();
  historyList = [];
  document.getElementById('tabContent').innerHTML = renderHistory();
}
function startNewOrder(){
  if(!confirm('هيتحفظ الطلب الحالي في الهيستوري ويتفتح طلب جديد فاضي لكل الأجهزة. متأكد؟')) return;
  db.ref(`historyIndex/${sid}`).set(true);
  const newSid = new Date().toISOString().replace(/[:.]/g,'-');
  db.ref(`sessions/${newSid}/meta`).set(defaultMeta()).then(()=>{
    db.ref('current').set(newSid); // the live /current listener switches everyone over automatically
  });
  closeModal();
}

/* ---------------- CHAT ---------------- */
function renderChat(){
  return `
  <div class="card flex flex-col w-full min-w-0" style="height:calc(100vh - 260px)">
    <div class="flex-1 overflow-y-auto p-3 space-y-3" id="chatScroll">
      ${chat.length===0? '<p class="text-center text-sm text-[#9C9080] mt-8">لسه مفيش رسايل</p>' :
        chat.map(m=>{
          const mine = m.personId===myId;
          const otherPerson = people[m.personId];
          return `<div style="display:flex;justify-content:${mine?'flex-end':'flex-start'}">
            <div style="display:flex;flex-direction:row;align-items:flex-end;gap:6px;max-width:80%">
              ${!mine?`<div style="flex-shrink:0">${avatarHtml(otherPerson,26)}</div>`:''}
              <div class="rounded-2xl px-3 py-2 text-sm" style="${mine?'background:#1F1B16;color:#fff':'background:#F3EEE1;color:#1F1B16'}">
                ${!mine?`<p class="text-[10px] font-bold mb-0.5" style="color:#E3A008">${esc(m.name)}</p>`:''}
                <p style="word-break:break-word">${esc(m.text)}</p>
              </div>
            </div>
          </div>`;
        }).join('')}
    </div>
    <div class="border-t-2 border-[#E7DFC9] p-2.5 flex gap-2">
      <input value="${esc(chatText)}" oninput="chatText=this.value" onkeydown="if(event.key==='Enter')sendChat()" placeholder="اكتب رسالة..."
        class="flex-1 min-w-0 rounded-xl border-2 border-[#E7DFC9] px-3 py-2 outline-none focus:border-[#E3A008]">
      <button onclick="sendChat()" class="rounded-xl px-4 font-bold flex-shrink-0" style="background:#E3A008;color:#1F1B16">➤</button>
    </div>
  </div>`;
}
function sendChat(){
  const t=(chatText||'').trim(); if(!t) return;
  chatText='';
  db.ref(`sessions/${sid}/chat`).push({ personId:myId, name:me().name, text:t, time:Date.now() });
  Object.values(people).forEach(p=>{
    if(p.id!==myId) db.ref(`sessions/${sid}/notify/${p.id}`).push({ type:'chat', title:'💬 رسالة جديدة', message:`${me().name}: ${t}`, time:Date.now() });
  });
}
function scrollChatBottom(){ setTimeout(()=>{ const el=document.getElementById('chatScroll'); if(el) el.scrollTop=el.scrollHeight; },50); }

/* ---------------- PROFILE MODAL ---------------- */
function renderProfileModal(){
  const p = me();
  profAvatar = p.avatar;
  document.getElementById('modalRoot').innerHTML = `
  <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-30" onclick="closeModal()">
    <div class="card p-5 max-w-sm w-full" style="background:#FAF6EE" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-4"><h3 class="font-bold" style="color:#1F1B16">👤 بياناتي</h3><button onclick="closeModal()">✕</button></div>
      <label class="text-xs font-semibold text-[#6B5F4D] mb-1 block">الاسم</label>
      <input id="profNameInput" value="${esc(p.name)}" class="w-full rounded-xl border-2 border-[#E7DFC9] px-3 py-2 mb-3 outline-none focus:border-[#E3A008]">
      <label class="text-xs font-semibold text-[#6B5F4D] mb-1 block">الأفاتار</label>
      <div class="grid grid-cols-6 gap-2 mb-2" id="profAvatarGrid">
        ${EMOJI_AVATARS.map(e=>`<button onclick="pickProfAvatar('${e}')" data-emoji="${e}" class="text-2xl rounded-lg py-1.5 border-2" style="border-color:${(p.avatar&&p.avatar.value===e)?'#E3A008':'#E7DFC9'}">${e}</button>`).join('')}
      </div>
      <input type="file" accept="image/*" onchange="handleAvatarUpload(event)" class="w-full text-xs mb-3">
      <button onclick="saveProfile()" class="w-full bg-[#1F1B16] text-white rounded-xl py-2.5 font-bold mb-2">حفظ</button>
      <button onclick="logout()" class="w-full text-xs text-[#B3432B] font-semibold py-1">تسجيل خروج</button>
    </div>
  </div>`;
}
let profAvatar = null;
function pickProfAvatar(e){
  profAvatar = {type:'emoji', value:e};
  document.querySelectorAll('#profAvatarGrid button').forEach(b=> b.style.borderColor = (b.dataset.emoji===e?'#E3A008':'#E7DFC9'));
}
async function handleAvatarUpload(ev){
  const file = ev.target.files[0]; if(!file) return;
  const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  const compressed = await compressImage(dataUrl, 300);
  profAvatar = {type:'image', value:compressed};
  showToast('تم رفع الصورة', 'اضغط حفظ عشان تتحدث');
}
function saveProfile(){
  const name = document.getElementById('profNameInput').value.trim();
  if(!name) return;
  const avatar = profAvatar || me().avatar;
  updateMe({ name, avatar });
  db.ref(`accounts/${myId}`).update({ name, avatar }); // canonical copy, so it carries over to new sessions/devices
  closeModal();
}

/* ---------------- MEMBERS (admin only) ---------------- */
function loadAccounts(){
  db.ref('accounts').once('value').then(snap=>{
    const val = snap.val() || {};
    accountsList = Object.values(val).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    if(tab==='members') document.getElementById('tabContent').innerHTML = renderMembers();
  });
}
function renderMembers(){
  if(accountsList.length===0) return `<div class="card p-6 text-center text-[#9C9080]">مفيش حسابات مسجلة لسه</div>`;
  return `
  <div class="card p-3 mb-3"><p class="text-xs text-[#9C9080] text-center">${accountsList.length} حساب مسجل على التطبيق</p></div>
  <div class="space-y-2">
    ${accountsList.map(a=>`
      <div class="card p-3 flex items-center justify-between">
        <span class="flex items-center gap-2 font-semibold text-sm" style="color:#1F1B16">${avatarHtml(a,26)} ${esc(a.name)}${a.id===myId?' (إنت)':''}</span>
        <button onclick="removeAccount('${a.id}','${esc(a.name)}')" class="text-xs font-bold text-[#B3432B]">🗑️ حذف</button>
      </div>`).join('')}
  </div>`;
}
function removeAccount(id, name){
  if(id===myId){ alert('متقدرش تمسح حسابك إنت وإنت داخل بيه'); return; }
  if(!confirm(`تمسح حساب "${name}"؟ هيتم تسجيل خروجه ومش هيقدر يدخل تاني بنفس البيانات.`)) return;
  db.ref(`accounts/${id}`).remove().then(loadAccounts);
}

/* ---------------- SETTINGS ---------------- */
function renderSettings(){
  document.getElementById('modalRoot').innerHTML = `
  <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-30" onclick="closeModal()">
    <div class="card p-5 max-w-sm w-full" style="background:#FAF6EE" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-4"><h3 class="font-bold" style="color:#1F1B16">⚙️ إعدادات</h3><button onclick="closeModal()">✕</button></div>

      <button onclick="requestNotifPermission()" class="w-full rounded-xl py-2.5 font-bold text-sm mb-3" style="background:${notifPermission==='granted'?'#2F6B4F':'#1F1B16'};color:#fff">
        ${notifPermission==='granted' ? '🔔 الإشعارات مفعّلة' : '🔔 فعّل الإشعارات'}
      </button>

      ${isAdmin? `
      <label class="text-xs font-semibold text-[#6B5F4D] mb-1 block">رابط الدفع (InstaPay) — اختياري</label>
      <input id="linkInput" value="${esc(meta.instapayLink||'')}" dir="ltr" placeholder="https://..."
        class="w-full rounded-xl border-2 border-[#E7DFC9] px-3 py-2 mb-3 outline-none focus:border-[#E3A008]">
      <button onclick="db.ref('sessions/'+sid+'/meta').update({instapayLink:document.getElementById('linkInput').value}); closeModal()" class="w-full bg-[#1F1B16] text-white rounded-xl py-2.5 font-bold mb-2">حفظ اللينك</button>
      <button onclick="startNewOrder()" class="w-full border-2 border-dashed rounded-xl py-2.5 font-semibold text-sm mb-2" style="border-color:#C9BE9F;color:#B3432B">أرشفة وبدء طلب جديد</button>
      <button onclick="isAdmin=false; localStorage.removeItem('food-app-is-admin'); closeModal(); renderApp();" class="w-full text-xs text-[#9C9080]">خروج من وضع الأدمن</button>
      ` : `
      <label class="text-xs font-semibold text-[#6B5F4D] mb-1 block">الدخول كأدمن</label>
      <input id="adminPassInput" type="password" placeholder="الباسورد" class="w-full rounded-xl border-2 border-[#E7DFC9] px-3 py-2 mb-2 outline-none focus:border-[#E3A008]">
      <button onclick="tryAdminLogin()" class="w-full bg-[#1F1B16] text-white rounded-xl py-2.5 font-bold">دخول كأدمن</button>
      `}
    </div>
  </div>`;
}
function tryAdminLogin(){
  const v = document.getElementById('adminPassInput').value;
  if(v === ADMIN_PASSWORD){
    isAdmin = true; localStorage.setItem('food-app-is-admin','true');
    closeModal(); renderApp();
  } else { alert('باسورد غلط'); }
}

/* ---------------- go ---------------- */
initFirebase();
if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
