<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورقة الطلب</title>
<meta name="theme-color" content="#1F1B16">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap');
  body{font-family:'IBM Plex Sans Arabic',sans-serif;background:#F3EEE1;}
  .num{font-family:'JetBrains Mono',monospace;}
  .card{background:#fff;border:2px solid #E7DFC9;border-radius:1rem;}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:#D8CFBB;border-radius:4px}
  @keyframes toastIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .toast{animation:toastIn .25s ease-out}
</style>
</head>
<body>
<div id="root" class="min-h-screen"></div>
<div id="toastRoot" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-[92%] max-w-sm"></div>

<script>
/* ============================================================
   ورقة الطلب — تطبيق تنظيم طلبات الأكل للزمايل
   Backend: Firebase Realtime Database
============================================================ */

/* حط بيانات مشروعك هنا (خطوات في README.md) */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC32u3Rk7QG4rEUqXp_qJ_97j_hsE-J6PM",
  authDomain: "food-orders-bbeff.firebaseapp.com",
  databaseURL: "https://food-orders-bbeff-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "food-orders-bbeff",
};

/* باسورد الأدمن — غيّره لأي حاجة تانية قبل ما ترفع المشروع */
const ADMIN_PASSWORD = "غيّر-الباسورد-ده";

const EMOJI_AVATARS = ['😀','😎','🤓','🥳','😺','🐶','🦊','🐼','🦁','🐸','🐵','🐷','🍕','🍔','🌮','🍩','⚡','🔥','🌟','💪','🚀','🎯','🎧','☕'];

const root = document.getElementById('root');
let db = null;
let sid = null;
let meta = null;
let people = {};
let chat = [];
let historyList = [];
let myId = localStorage.getItem('food-app-my-id');
if(!myId){ myId = uid(); localStorage.setItem('food-app-my-id', myId); }
let isAdmin = localStorage.getItem('food-app-is-admin') === 'true';
let tab = 'voting';
let notifStartTime = Date.now();
let notifPermission = (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported';

let newOption = { name:'', menuType:'none', menuValue:'', menuFileType:'' };
let itemDesc='', itemQty=1;
let chatText='';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayId(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function defaultMeta(){
  return { date: todayId(), createdAt: Date.now(), restaurantOptions: [], deliveryFee:0, taxEnabled:false, taxPercent:14, instapayLink:'' };
}
function defaultPerson(id){ return { id, name:'', avatar:null, vote:null, items:[], paid:false }; }

/* ---------------- toast + notifications ---------------- */
function showToast(title, body){
  const el = document.createElement('div');
  el.className = 'toast card p-3 shadow-xl';
  el.innerHTML = `<p class="font-bold text-sm" style="color:#1F1B16">${esc(title)}</p>${body?`<p class="text-xs text-[#6B5F4D] mt-0.5">${esc(body)}</p>`:''}`;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(()=>el.remove(), 5000);
  if(notifPermission==='granted'){
    try{ new Notification(title, { body, icon:'icon.svg' }); }catch(e){}
  }
}
function requestNotifPermission(){
  if(typeof Notification==='undefined'){ alert('المتصفح ده مش بيدعم الإشعارات'); return; }
  Notification.requestPermission().then(p=>{ notifPermission=p; renderApp(); });
}
function attachNotifications(){
  db.ref(`sessions/${sid}/notify/${myId}`).on('child_added', snap=>{
    const v = snap.val();
    if(v && v.time > notifStartTime) showToast(v.title || '🔔 إشعار', v.message || '');
  });
  db.ref(`sessions/${sid}/notify/all`).on('child_added', snap=>{
    const v = snap.val();
    if(v && v.time > notifStartTime) showToast(v.title || '🔔 إشعار عام', v.message || '');
  });
}
function notifyPayment(personId, personName){
  db.ref(`sessions/${sid}/notify/${personId}`).push({ title:'💳 فاتورة الأكل', message:`${myPersonName()} بيفكّرك تدفع حسابك`, time: Date.now() });
  showToast('تم إرسال تذكير', `لـ ${personName}`);
}
function notifyAll(){
  db.ref(`sessions/${sid}/notify/all`).push({ title:'🎉 الأوردر وصل!', message:'الأكل وصل من المطعم، اتفضلوا', time: Date.now() });
  showToast('تم الإرسال', 'كل الزمايل هياخدوا إشعار');
}
function myPersonName(){ return me().name || 'الأدمن'; }

/* ---------------- Firebase init ---------------- */
function initFirebase(){
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith('ضع-')){ renderConfigMissingScreen(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    boot();
  }catch(e){ renderConfigMissingScreen('في مشكلة في بيانات Firebase — راجعها في أول الكود.'); }
}
function renderConfigMissingScreen(err){
  root.innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-6" style="background:#1F1B16">
    <div class="card p-6 max-w-md w-full text-center" style="background:#FAF6EE;border-color:#E3A008;border-style:dashed;border-width:3px">
      <div class="inline-block bg-[#E3A008] rounded-full p-3 mb-2">⚠️</div>
      <h1 class="text-xl font-bold mb-2" style="color:#1F1B16">لسه محتاج إعداد</h1>
      <p class="text-sm text-[#6B5F4D]">${err? esc(err) : 'راجع بيانات Firebase في أول ملف index.html'}</p>
    </div>
  </div>`;
}

/* ---------------- boot ---------------- */
function boot(){
  db.ref('current').once('value').then(snap=>{
    sid = snap.val();
    if(!sid){ sid = todayId(); db.ref('current').set(sid); }
    return db.ref(`sessions/${sid}/meta`).once('value');
  }).then(snap=>{
    if(!snap.exists()) db.ref(`sessions/${sid}/meta`).set(defaultMeta());
    return db.ref(`sessions/${sid}/people/${myId}`).once('value');
  }).then(snap=>{
    attachSession();
    attachNotifications();
    if(!snap.exists() || !snap.val().name){ renderProfileGate(); }
    else { renderApp(); }
  });
}
function attachSession(){
  db.ref(`sessions/${sid}/meta`).on('value', snap=>{ meta = snap.val() || defaultMeta(); if(me().name) renderApp(); });
  db.ref(`sessions/${sid}/people`).on('value', snap=>{ people = snap.val() || {}; if(me().name) renderApp(); });
  db.ref(`sessions/${sid}/chat`).on('value', snap=>{
    const val = snap.val() || {};
    chat = Object.keys(val).sort().map(k=>val[k]);
    if(me().name) renderApp();
  });
}
function me(){ return (people[myId]) || defaultPerson(myId); }

function renderProfileGate(){
  root.innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-6" style="background:#1F1B16">
    <div class="card p-8 max-w-sm w-full text-center" style="background:#FAF6EE;border-color:#E3A008;border-style:dashed;border-width:3px">
      <div class="inline-block bg-[#E3A008] rounded-full p-4 mb-3 text-3xl">🍽️</div>
      <h1 class="text-2xl font-bold mb-1" style="color:#1F1B16">ورقة الطلب</h1>
      <p class="text-sm text-[#6B5F4D] mb-4">اكتب اسمك واختار أفاتار</p>
      <input id="nameInput" autofocus placeholder="اسمك..." class="w-full rounded-xl border-2 border-[#D8CFBB] px-4 py-3 text-lg text-center outline-none focus:border-[#E3A008] mb-4">
      <div class="grid grid-cols-6 gap-2 mb-4" id="avatarGrid">
        ${EMOJI_AVATARS.map(e=>`<button onclick="pickGateAvatar('${e}')" data-emoji="${e}" class="text-2xl rounded-lg py-1.5 border-2 border-[#E7DFC9]">${e}</button>`).join('')}
      </div>
      <button onclick="saveProfileGate()" class="w-full bg-[#1F1B16] text-white rounded-xl py-3 font-bold">دخول</button>
    </div>
  </div>`;
}
let gateAvatar = EMOJI_AVATARS[Math.floor(Math.random()*EMOJI_AVATARS.length)];
function pickGateAvatar(e){
  gateAvatar = e;
  document.querySelectorAll('#avatarGrid button').forEach(b=> b.style.borderColor = (b.dataset.emoji===e?'#E3A008':'#E7DFC9'));
}
function saveProfileGate(){
  const v = document.getElementById('nameInput').value.trim();
  if(!v) return;
  db.ref(`sessions/${sid}/people/${myId}`).set({ ...defaultPerson(myId), name:v, avatar:{type:'emoji',value:gateAvatar} });
  setTimeout(renderApp, 150);
}

/* ---------------- data helpers ---------------- */
function updateMe(patch){ db.ref(`sessions/${sid}/people/${myId}`).update(patch); }
function participants(){ return Object.values(people).filter(p=>p.items && p.items.length>0); }
function leadingOptionId(){
  const counts = {};
  (meta.restaurantOptions||[]).forEach(o=>counts[o.id]=0);
  Object.values(people).forEach(p=>{ if(p.vote && counts[p.vote]!==undefined) counts[p.vote]++; });
  let best=-1, id=null;
  Object.entries(counts).forEach(([k,v])=>{ if(v>best){best=v; id=k;} });
  return id;
}
function currentRestaurantName(){
  const id = leadingOptionId();
  const opt = (meta.restaurantOptions||[]).find(o=>o.id===id);
  return opt ? opt.name : 'لسه معروفش';
}
function deliveryShare(){ const n=participants().length; return n>0 ? (meta.deliveryFee||0)/n : 0; }
function personTotal(p){
  const subtotal = (p.items||[]).reduce((s,i)=>s+i.price*i.qty,0);
  const tax = meta.taxEnabled ? subtotal*(meta.taxPercent||0)/100 : 0;
  const delivery = (p.items&&p.items.length>0) ? deliveryShare() : 0;
  return { subtotal, tax, delivery, total: subtotal+tax+delivery };
}
function avatarHtml(p, size){
  size = size || 32;
  if(p && p.avatar && p.avatar.type==='emoji'){
    return `<span style="font-size:${size*0.6}px;width:${size}px;height:${size}px" class="inline-flex items-center justify-center rounded-full bg-[#F3EEE1] border border-[#E7DFC9]">${p.avatar.value}</span>`;
  }
  if(p && p.avatar && p.avatar.type==='image'){
    return `<img src="${p.avatar.value}" style="width:${size}px;height:${size}px" class="rounded-full object-cover border border-[#E7DFC9]">`;
  }
  const letter = (p&&p.name? p.name[0] : '?').toUpperCase();
  return `<span style="width:${size}px;height:${size}px;font-size:${size*0.45}px" class="inline-flex items-center justify-center rounded-full font-bold" style="background:#E3A008;color:#1F1B16">${esc(letter)}</span>`;
}
function compressImage(dataUrl, maxW){
  maxW = maxW || 500;
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const w = img.width*scale, h = img.height*scale;
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = dataUrl;
  });
}

/* ---------------- shell ---------------- */
function tabList(){
  const t = [{id:'voting',label:'التصويت',icon:'🗳️'},{id:'ordering',label:'الطلبات',icon:'🛍️'}];
  if(isAdmin){
    t.push({id:'billing',label:'الحساب',icon:'🧾'});
    t.push({id:'payment',label:'الدفع',icon:'💳'});
    t.push({id:'history',label:'الهيستوري',icon:'📜'});
  } else {
    t.push({id:'mybill',label:'حسابي',icon:'🧾'});
  }
  t.push({id:'chat',label:'الشات',icon:'💬'});
  return t;
}
function renderApp(){
  const tabs = tabList();
  if(!tabs.find(t=>t.id===tab)) tab='voting';
  root.innerHTML = `
  <header class="sticky top-0 z-20 shadow-lg" style="background:#1F1B16;color:#FAF6EE">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="bg-[#E3A008] rounded-lg p-1.5 text-lg">🍽️</div>
        <div><div class="font-bold leading-none">ورقة الطلب</div><div class="text-[10px] text-[#B8AD97] mt-0.5">${esc(meta.date)} · ${esc(currentRestaurantName())}</div></div>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="renderProfileModal()" class="flex items-center gap-1 text-xs bg-[#332C24] px-2 py-1 rounded-full">
          ${avatarHtml(me(),18)} ${esc(me().name)} ${isAdmin?'<span class="text-[#E3A008]">👑</span>':''}
        </button>
        <button onclick="renderSettings()" class="p-2 hover:bg-[#332C24] rounded-lg">⚙️</button>
      </div>
    </div>
    <nav class="max-w-2xl mx-auto px-2 pb-2 flex gap-1 overflow-x-auto">
      ${tabs.map(t=>`<button onclick="setTab('${t.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap"
        style="${tab===t.id?'background:#E3A008;color:#1F1B16':'background:#332C24;color:#B8AD97'}">${t.icon} ${t.label}</button>`).join('')}
    </nav>
  </header>
  <main class="max-w-2xl mx-auto p-4 pb-24" id="tabContent"></main>
  <div id="modalRoot"></div>`;
  renderTab();
}
function setTab(t){ tab=t; renderApp(); }
function renderTab(){
  const el = document.getElementById('tabContent');
  if(tab==='voting') el.innerHTML = renderVoting();
  else if(tab==='ordering') el.innerHTML = renderOrdering();
  else if(tab==='billing' && isAdmin) el.innerHTML = renderBilling();
  else if(tab==='payment' && isAdmin) el.innerHTML = renderPayment();
  else if(tab==='mybill' && !isAdmin) el.innerHTML = renderMyBill();
  else if(tab==='history' && isAdmin){ el.innerHTML = '<div class="text-center text-sm text-[#9C9080] py-6">بيتحمّل...</div>'; loadHistory(); }
  else if(tab==='chat'){ el.innerHTML = renderChat(); scrollChatBottom(); }
}

/* ---------------- VOTING (always live, no lock) ---------------- */
function voteCounts(){
  const c = {};
  (meta.restaurantOptions||[]).forEach(o=>c[o.id]=0);
  Object.values(people).forEach(p=>{ if(p.vote && c[p.vote]!==undefined) c[p.vote]++; });
  return c;
}
function renderVoting(){
  const counts = voteCounts();
  const total = Object.values(people).filter(p=>p.vote).length;
  const opts = meta.restaurantOptions||[];
  const leaderId = leadingOptionId();
  const optionsHtml = opts.map(o=>{
    const count = counts[o.id]||0;
    const pct = total>0? Math.round(count/total*100):0;
    const mine = me().vote===o.id;
    const isLeader = o.id===leaderId && count>0;
    let menuHtml = '';
    if(o.menuType==='link') menuHtml = `<a href="${esc(o.menuValue)}" target="_blank" onclick="event.stopPropagation()" class="text-[11px] underline text-[#6B5F4D]">📋 المنيو</a>`;
    else if(o.menuType==='file' && o.menuFileType==='image') menuHtml = `<img src="${o.menuValue}" onclick="event.stopPropagation();openImagePreview('${o.id}')" class="w-8 h-8 rounded object-cover cursor-pointer border border-[#E7DFC9]">`;
    else if(o.menuType==='file' && o.menuFileType==='pdf') menuHtml = `<a href="${o.menuValue}" target="_blank" onclick="event.stopPropagation()" class="text-[11px] underline text-[#6B5F4D]">📄 PDF</a>`;
    return `
    <div class="relative overflow-hidden rounded-xl border-2 border-[#E7DFC9] mb-2">
      <div class="absolute inset-y-0 right-0" style="width:${pct}%;background:#FDF0CC;transition:width .3s"></div>
      <button onclick="castVote('${o.id}')" class="relative w-full flex items-center justify-between px-4 py-3">
        <span class="flex items-center gap-2 font-semibold" style="color:#1F1B16">
          ${mine?'✅':'⭕'} ${esc(o.name)} ${isLeader?'👑':''} ${menuHtml}
        </span>
        <span class="num text-sm font-bold text-[#6B5F4D]">${count} صوت · ${pct}%</span>
      </button>
    </div>`;
  }).join('');

  return `
  <div class="card p-4">
    <h2 class="font-bold mb-3 flex items-center gap-2" style="color:#1F1B16">🗳️ نطلب من مطعم إيه النهاردة؟</h2>
    <div class="border-2 border-dashed border-[#E7DFC9] rounded-xl p-3 mb-4">
      <input value="${esc(newOption.name)}" oninput="newOption.name=this.value" placeholder="اسم مطعم جديد..."
        class="w-full rounded-lg border-2 border-[#E7DFC9] px-3 py-2 outline-none focus:border-[#E3A008] mb-2">
      <div class="flex gap-1 mb-2">
        <button onclick="setMenuType('none')" class="flex-1 text-xs py-1.5 rounded-lg font-semibold" style="${newOption.menuType==='none'?'background:#1F1B16;color:#fff':'background:#F3EEE1;color:#6B5F4D'}">بدون منيو</button>
        <button onclick="setMenuType('link')" class="flex-1 text-xs py-1.5 rounded-lg font-semibold" style="${newOption.menuType==='link'?'background:#1F1B16;color:#fff':'background:#F3EEE1;color:#6B5F4D'}">🔗 لينك</button>
        <button onclick="setMenuType('file')" class="flex-1 text-xs py-1.5 rounded-lg font-semibold" style="${newOption.menuType==='file'?'background:#1F1B16;color:#fff':'background:#F3EEE1;color:#6B5F4D'}">📎 رفع ملف</button>
      </div>
      ${newOption.menuType==='link'?`<input value="${esc(newOption.menuValue)}" oninput="newOption.menuValue=this.value" dir="ltr" placeholder="https://..." class="w-full rounded-lg border-2 border-[#E7DFC9] px-3 py-2 outline-none focus:border-[#E3A008] mb-2 text-sm">`:''}
      ${newOption.menuType==='file'?`
        <input type="file" accept="image/*,.pdf,application/pdf" onchange="handleMenuFile(event)" class="w-full text-xs mb-1">
        ${newOption.menuValue?`<p class="text-xs text-green-700">تم إرفاق ${newOption.menuFileType==='image'?'صورة ✅':'PDF ✅'}</p>`:'<p class="text-[10px] text-[#9C9080]">الملفات الكبيرة أوي (أكتر من ٣ ميجا) الأفضل تحطها لينك</p>'}
      `:''}
      <button onclick="addOption()" class="w-full bg-[#1F1B16] text-white rounded-lg py-2 font-bold text-sm mt-1">إضافة المطعم</button>
    </div>
    ${opts.length===0? '<p class="text-sm text-[#9C9080] text-center py-4">لسه مفيش مطاعم مضافة</p>' : optionsHtml}
    <p class="text-xs text-[#9C9080] text-center mt-2">التصويت مفتوح طول الوقت، والمطعم اللي فوق (👑) بيتحدّث أوتوماتيك حسب الأصوات</p>
  </div>`;
}
function setMenuType(t){ newOption.menuType=t; renderTab(); }
async function handleMenuFile(ev){
  const file = ev.target.files[0]; if(!file) return;
  const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  if(file.type.startsWith('image/')){ newOption.menuValue = await compressImage(dataUrl,1000); newOption.menuFileType='image'; }
  else{
    if(file.size > 3*1024*1024) alert('الملف كبير أوي، فضّل رابط بدل الرفع.');
    newOption.menuValue = dataUrl; newOption.menuFileType='pdf';
  }
  renderTab();
}
function addOption(){
  const name = (newOption.name||'').trim(); if(!name) return;
  const opt = { id: uid(), name, menuType:newOption.menuType, menuValue:newOption.menuValue, menuFileType:newOption.menuFileType };
  db.ref(`sessions/${sid}/meta/restaurantOptions`).set([...(meta.restaurantOptions||[]), opt]);
  newOption = { name:'', menuType:'none', menuValue:'', menuFileType:'' };
}
function castVote(id){ updateMe({ vote:id }); }
function openImagePreview(id){
  const opt = (meta.restaurantOptions||[]).find(o=>o.id===id); if(!opt) return;
  document.getElementById('modalRoot').innerHTML = `<div class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-30" onclick="closeModal()"><img src="${opt.menuValue}" class="max-w-full max-h-full rounded-lg"></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ---------------- ORDERING (always live) ---------------- */
function renderOrdering(){
  const orders = participants();
  return `
  <div class="card p-4 mb-4">
    <h2 class="font-bold mb-1" style="color:#1F1B16">🛍️ طلبك (${esc(currentRestaurantName())})</h2>
    <p class="text-xs text-[#9C9080] mb-3">اكتب كل صنف عايزه، السعر هيتحدد بعدين</p>
    <div class="flex gap-2 mb-3">
      <input value="${esc(itemDesc)}" oninput="itemDesc=this.value" onkeydown="if(event.key==='Enter')addItem()" placeholder="مثال: ساندوتش فراخ بانيه"
        class="flex-1 rounded-xl border-2 border-[#E7DFC9] px-3 py-2 outline-none focus:border-[#E3A008]">
      <input type="number" min="1" value="${itemQty}" oninput="itemQty=this.value" class="w-16 rounded-xl border-2 border-[#E7DFC9] px-2 py-2 text-center outline-none focus:border-[#E3A008]">
      <button onclick="addItem()" class="bg-[#1F1B16] text-white rounded-xl px-4">+</button>
    </div>
    <div class="space-y-2">
      ${me().items.length===0? '<p class="text-sm text-[#9C9080] text-center py-3">لسه معملتش طلب</p>' :

function addItem(){
  const d=(itemDesc||'').trim(); if(!d) return;
  updateMe({ items: [...me().items, { id:uid(), desc:d, qty:Number(itemQty)||1, price:0 }] });
  itemDesc=''; itemQty=1;
}
function removeItem(personId, itemId){
  if(personId!==myId && !isAdmin) return;
  const p = people[personId]; if(!p) return;
  db.ref(`sessions/${sid}/people/${personId}/items`).set(p.items.filter(i=>i.id!==itemId));
}
function editItemAdmin(personId, itemId){
  const p = people[personId]; if(!p) return;
  const item = p.items.find(i=>i.id===itemId); if(!item) return;
  const newDesc = prompt('تعديل الصنف:', item.desc); if(newDesc===null) return;
  const newQty = prompt('العدد:', item.qty); if(newQty===null) return;
  const items = p.items.map(i=> i.id===itemId? {...i, desc:newDesc.trim()||item.desc, qty:Number(newQty)||item.qty} : i);
  db.ref(`sessions/${sid}/people/${personId}/items`).set(items);
}

/* ---------------- HISTORY (admin only) ---------------- */
function loadHistory(){
  db.ref('historyIndex').once('value').then(async snap=>{
    const ids = snap.val() ? Object.keys(snap.val()) : [];
    const list = [];
    for(const hid of ids){
      const [m,p] = await Promise.all([
        db.ref(`sessions/${hid}/meta`).once('value'),
        db.ref(`sessions/${hid}/people`).once('value'),
      ]);
      const mv = m.val(), pv = p.val()||{};
      if(!mv) continue;
      const arr = Object.values(pv).filter(x=>x.items&&x.items.length>0);
      list.push({ id:hid, meta:mv, people:arr });
    }
    list.sort((a,b)=> (b.meta.createdAt||0) - (a.meta.createdAt||0));
    historyList = list;
    if(tab==='history') document.getElementById('tabContent').innerHTML = renderHistory();
  });
}
function historyTotal(entry){
  const savedMeta = meta; meta = entry.meta;
  const total = entry.people.reduce((s,p)=>s+personTotal(p).total,0);
  meta = savedMeta;
  return total;
}
function renderHistory(){
  if(historyList.length===0) return `<div class="card p-6 text-center text-[#9C9080]">مفيش هيستوري لسه</div>`;
  return `
  <div class="flex justify-end mb-3"><button onclick="clearAllHistory()" class="text-xs font-bold text-[#B3432B]">🗑️ مسح كل الهيستوري</button></div>
  <div class="space-y-3">
    ${historyList.map(h=>`
      <div class="card p-4">
        <div class="flex items-center justify-between">
          <div><p class="font-bold" style="color:#1F1B16">${esc(h.meta.date)}</p>
          <p class="text-xs text-[#9C9080]">${esc(h.meta.restaurantOptions && h.meta.restaurantOptions.length? h.meta.restaurantOptions[0].name : '')} · ${h.people.length} شخص</p></div>
          <div class="text-left">
            <p class="num font-bold" style="color:#1F1B16">${historyTotal(h).toFixed(2)} ج</p>
            <button onclick="deleteHistoryEntry('${h.id}')" class="text-xs text-[#B3432B]">🗑️ مسح</button>
          </div>
        </div>
      </div>`).join('')}
  </div>`;
}
function deleteHistoryEntry(hid){
  if(!confirm('تمسح الطلب ده من الهيستوري؟')) return;
  db.ref(`sessions/${hid}`).remove();
  db.ref(`historyIndex/${hid}`).remove();
  loadHistory();
}
function clearAllHistory(){
  if(!confirm('متأكد عايز تمسح كل الهيستوري؟ الإجراء ده نهائي.')) return;
  historyList.forEach(h=>{ db.ref(`sessions/${h.id}`).remove(); });
  db.ref('historyIndex').remove();
  historyList = [];
  document.getElementById('tabContent').innerHTML = renderHistory();
}
function startNewOrder(){
  if(!confirm('هيتحفظ الطلب الحالي في الهيستوري ويتفتح طلب جديد فاضي. متأكد؟')) return;
  db.ref(`historyIndex/${sid}`).set(true);
  const newSid = new Date().toISOString().replace(/[:.]/g,'-');
  db.ref('current').set(newSid);
  db.ref(`sessions/${newSid}/meta`).set(defaultMeta());
  sid = newSid;
  attachSession();
  attachNotifications();
  notifStartTime = Date.now();
  tab = 'voting';
  closeModal();
}

              ${!mine?`<p class="text-[10px] font-bold mb-0.5" style="color:#E3A008">${esc(m.name)}</p>`:''}
              <p>${esc(m.text)}</p>
            </div></div>`;
        }).join('')}
    </div>
    <div class="border-t-2 border-[#E7DFC9] p-3 flex gap-2">
      <input value="${esc(chatText)}" oninput="chatText=this.value" onkeydown="if(event.key==='Enter')sendChat()" placeholder="اكتب رسالة..."
        class="flex-1 rounded-xl border-2 border-[#E7DFC9] px-3 py-2 outline-none focus:border-[#E3A008]">
      <button onclick="sendChat()" class="rounded-xl px-4" style="background:#E3A008;color:#1F1B16">➤</button>

function sendChat(){
  const t=(chatText||'').trim(); if(!t) return;
  chatText='';
  db.ref(`sessions/${sid}/chat`).push({ personId:myId, name:me().name, text:t, time:Date.now() });
  Object.values(people).forEach(p=>{
    if(p.id!==myId) db.ref(`sessions/${sid}/notify/${p.id}`).push({ title:'💬 رسالة جديدة', message:`${me().name}: ${t}`, time:Date.now() });
  });
}
function scrollChatBottom(){ setTimeout(()=>{ const el=document.getElementById('chatScroll'); if(el) el.scrollTop=el.scrollHeight; },50); }

function renderProfileModal(){

  document.getElementById('modalRoot').innerHTML = `
  <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-30" onclick="closeModal()">
    <div class="card p-5 max-w-sm w-full" style="background:#FAF6EE" onclick="event.stopPropagation()">

      <label class="text-xs font-semibold text-[#6B5F4D] mb-1 block">الاسم</label>
      <input id="profNameInput" value="${esc(p.name)}" class="w-full rounded-xl border-2 border-[#E7DFC9] px-3 py-2 mb-3 outline-none focus:border-[#E3A008]">
      <label class="text-xs font-semibold text-[#6B5F4D] mb-1 block">الأفاتار</label>
      <div class="grid grid-cols-6 gap-2 mb-2" id="profAvatarGrid">
        ${EMOJI_AVATARS.map(e=>`<button onclick="pickProfAvatar('${e}')" data-emoji="${e}" class="text-2xl rounded-lg py-1.5 border-2" style="border-color:${(p.avatar&&p.avatar.value===e)?'#E3A008':'#E7DFC9'}">${e}</button>`).join('')}
      </div>
      <input type="file" accept="image/*" onchange="handleAvatarUpload(event)" class="w-full text-xs mb-3">

    </div>
  </div>`;
}
let profAvatar = me().avatar;
function pickProfAvatar(e){
  profAvatar = {type:'emoji', value:e};
  document.querySelectorAll('#profAvatarGrid button').forEach(b=> b.style.borderColor = (b.dataset.emoji===e?'#E3A008':'#E7DFC9'));
}
async function handleAvatarUpload(ev){
  const file = ev.target.files[0]; if(!file) return;
  const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  const compressed = await compressImage(dataUrl, 300);
  profAvatar = {type:'image', value:compressed};
  showToast('تم رفع الصورة', 'اضغط حفظ عشان تتحدث');
}
function saveProfile(){
  const name = document.getElementById('profNameInput').value.trim();
  if(!name) return;
  updateMe({ name, avatar: profAvatar || me().avatar });
  closeModal();
}
